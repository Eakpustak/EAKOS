
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eakos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: eakos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eakos -d eakos"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: eakos-app:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://eakos:${POSTGRES_PASSWORD}@db:5432/eakos
      NEXTAUTH_URL: https://${DOMAIN:?set in .env}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      HANDOVER_ACK_HOURS: ${HANDOVER_ACK_HOURS:-24}
      DOCUMENTS_DIR: /data/documents
    volumes:
      - docdata:/data/documents

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - docdata:/documents:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/nightly-$$(date +%Y%m%d-%H%M%S).sql.gz
          pg_dump -h db -U eakos eakos | gzip > "$$f" && echo "backup ok: $$f"
          d=/backups/documents-$$(date +%Y%m%d-%H%M%S).tar.gz
          tar czf "$$d" -C /documents . && echo "documents backup ok: $$d"
          ls -1t /backups/documents-*.tar.gz 2>/dev/null | tail -n +15 | xargs -r rm -f
          ls -1t /backups/nightly-*.sql.gz 2>/dev/null | tail -n +15 | xargs -r rm -f
          sleep 86400
        done

volumes:
  pgdata:
  docdata:
