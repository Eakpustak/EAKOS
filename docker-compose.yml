services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eakos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: eakos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eakos -d eakos"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: eakos-app:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://eakos:${POSTGRES_PASSWORD}@db:5432/eakos
      NEXTAUTH_URL: https://${DOMAIN:?set in .env}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    # Nightly dump, keep the newest 14 scheduled dumps.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/nightly-$$(date +%Y%m%d-%H%M%S).sql.gz
          pg_dump -h db -U eakos eakos | gzip > "$$f" && echo "backup ok: $$f"
          ls -1t /backups/nightly-*.sql.gz 2>/dev/null | tail -n +15 | xargs -r rm -f
          sleep 86400
        done

volumes:
  pgdata:
  caddy_data:
  caddy_config:
